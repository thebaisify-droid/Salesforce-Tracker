name: Revised one-off $0.80 UK market pilot
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Enter AUTHORISE_REVISED_080_PILOT for one paid run'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shared-apify-acquisition
  cancel-in-progress: false
jobs:
  pilot:
    if: ${{ inputs.approval == 'AUTHORISE_REVISED_080_PILOT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one authorised capped pilot
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PILOT_APPROVAL: ${{ inputs.approval }}
        run: python -m scripts.run_candidate_pilot_v2 --execute
      - name: Upload evidence even after a partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-pilot-evidence
          path: candidate-pilot-evidence.json
          if-no-files-found: warn
          retention-days: 7
