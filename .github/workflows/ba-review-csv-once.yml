name: Export 161 acquired adverts to reviewer CSV (offline, one time)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/ba-review-csv-once.yml'
permissions:
  contents: read
jobs:
  export:
    if: ${{ github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/ba-paid-datasets-20261016-offline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate all 161 source records locally
        run: |
          python -m scripts.export_ba_20261016_manual_csv
          python -m unittest discover -s tests -p test_ba_20261016_readonly_audit.py -v
      - name: Upload review CSV (never publish automatically)
        uses: actions/upload-artifact@v4
        with:
          name: ba-manual-review-161-vacancies-20261016
          path: dist/uk-business-technology-161-vacancies-manual-review-2026-10-16.csv
          retention-days: 30
          if-no-files-found: error
