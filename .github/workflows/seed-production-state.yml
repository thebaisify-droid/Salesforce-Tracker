name: Seed production tracker state

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seed-production-state.yml"

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TRACKER_DATABASE_PATH: data/salesforce_tracker.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight
        run: python -m pipeline.daily_refresh --config config/pipeline.json --check

      - name: Create first persistent production state
        run: python -m pipeline.daily_refresh --config config/pipeline.json --force

      - name: Verify state and write manifest
        run: python -m scripts.state_snapshot --root . --database "$TRACKER_DATABASE_PATH" --write-manifest state/state_manifest.json

      - name: Upload production tracker state
        uses: actions/upload-artifact@v4
        with:
          name: tracker-state
          path: |
            data/salesforce_tracker.db
            state/
            dashboard/data.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload seed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-state-seed-${{ github.run_id }}
          path: |
            state/
            runs/**/run_status.json
            runs/**/metrics.json
            runs/**/quality_report.json
            dashboard/data.json
          if-no-files-found: ignore
          retention-days: 30
