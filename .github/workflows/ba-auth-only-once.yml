name: BA authentication-only one-time test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ba-auth-only-once.yml']
permissions:
  contents: read
jobs:
  test:
    if: ${{ contains(github.event.head_commit.message, '[BA-AUTH-ONLY-ONCE-20261015]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticated user endpoint GET only
        env:
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
        run: python -m scripts.ba_auth_only_probe
