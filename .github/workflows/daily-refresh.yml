name: Daily Salesforce tracker refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"

concurrency:
  group: salesforce-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.TRACKER_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TRACKER_DATABASE_PATH: data/salesforce_tracker.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest persistent tracker state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state-restore
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tracker-state&per_page=100"
          curl -fsSL             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$api" > .state-restore/artifacts.json

          artifact_id="$(python - <<'PY'
          import json
          from pathlib import Path

          payload=json.loads(Path(".state-restore/artifacts.json").read_text())
          candidates=[
              item for item in payload.get("artifacts", [])
              if not item.get("expired")
              and (item.get("workflow_run") or {}).get("head_branch") == "main"
          ]
          candidates.sort(key=lambda item: item.get("created_at") or "", reverse=True)
          print(candidates[0]["id"] if candidates else "")
          PY
          )"

          if [ -z "$artifact_id" ]; then
            echo "No previous tracker-state artifact exists; this will be the initial persistent run."
            exit 0
          fi

          echo "Restoring tracker-state artifact $artifact_id"
          curl -fsSL --location             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"             -o .state-restore/tracker-state.zip

          python -m scripts.state_snapshot --root . --extract .state-restore/tracker-state.zip

      - name: Install project dependencies
        run: |
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Preflight
        run: python -m pipeline.daily_refresh --config config/pipeline.json --check

      - name: Run daily refresh
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python -m pipeline.daily_refresh --config config/pipeline.json --force
          else
            python -m pipeline.daily_refresh --config config/pipeline.json --scheduled
          fi

      - name: Verify persistent state and write manifest
        if: success() && hashFiles('data/salesforce_tracker.db') != ''
        run: python -m scripts.state_snapshot --root . --database "$TRACKER_DATABASE_PATH" --write-manifest state/state_manifest.json

      - name: Upload persistent tracker state
        if: success() && hashFiles('data/salesforce_tracker.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tracker-state
          path: |
            data/salesforce_tracker.db
            state/
            dashboard/data.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_id }}
          path: |
            state/*.json
            runs/**/run_status.json
            runs/**/metrics.json
            runs/**/quality_report.json
            dashboard/data.json
          if-no-files-found: ignore
          retention-days: 30
