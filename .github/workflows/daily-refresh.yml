name: Daily Salesforce tracker refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"

concurrency:
  group: salesforce-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      TRACKER_DATABASE_PATH: data/salesforce_tracker.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest persistent tracker state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.restore_github_state --root . --artifact-name tracker-state --branch main

      - name: Install project dependencies
        run: |
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Preflight
        run: python -m pipeline.daily_refresh --config config/pipeline.json --check

      - name: Run daily refresh
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python -m pipeline.daily_refresh --config config/pipeline.json --force
          else
            python -m pipeline.daily_refresh --config config/pipeline.json --scheduled
          fi

      - name: Verify persistent state and write manifest
        if: success() && hashFiles('data/salesforce_tracker.db') != ''
        run: python -m scripts.state_snapshot --root . --database "$TRACKER_DATABASE_PATH" --write-manifest state/state_manifest.json

      - name: Upload persistent tracker state
        if: success() && hashFiles('data/salesforce_tracker.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tracker-state
          path: |
            data/salesforce_tracker.db
            state/
            dashboard/data.json
            dashboard/live-data.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish sanitised dashboard JSON to main
        if: success() && hashFiles('dashboard/live-data.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cp dashboard/live-data.json /tmp/live-data.json
          git config user.name "salesforce-tracker-bot"
          git config user.email "salesforce-tracker-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B dashboard-publish origin/main
          cp /tmp/live-data.json dashboard/live-data.json
          git add dashboard/live-data.json
          if git diff --cached --quiet; then
            echo "Public dashboard JSON is unchanged."
          else
            git commit -m "Update live dashboard data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_id }}
          path: |
            state/*.json
            runs/**/run_status.json
            runs/**/metrics.json
            runs/**/quality_report.json
            runs/**/lifecycle_report.json
            dashboard/data.json
            dashboard/live-data.json
          if-no-files-found: ignore
          retention-days: 30
