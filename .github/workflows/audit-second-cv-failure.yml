name: Audit second CV-Library pilot failure (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Examine historical run metadata only
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scripts.audit_second_cv_failure
      - uses: actions/upload-artifact@v4
        with:
          name: second-cv-failure-audit
          path: second-cv-failure-audit.json
          retention-days: 7
