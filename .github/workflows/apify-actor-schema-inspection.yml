name: Verify Apify actor input schemas (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Actor metadata and input schema (GET only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scripts.inspect_apify_actor_schemas
      - name: Upload redacted schema fields
        uses: actions/upload-artifact@v4
        with:
          name: actor-schema-evidence
          path: actor-schema-evidence.json
          retention-days: 7
          if-no-files-found: error
