name: One-time BA restricted credential verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ba-restricted-auth-once.yml'

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[BA-RESTRICTED-AUTH-ONCE-20261015]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GET-only restricted BA account authentication
        env:
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
        run: python -m scripts.ba_auth_only_probe
      - name: Inspect dedicated BA receiver method via OPTIONS only
        env:
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
        run: python -m scripts.ba_delivery_credentials_readonly
