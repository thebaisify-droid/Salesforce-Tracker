name: One-time $25 Apify limit verification (read only)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/apify-25-limit-verify-once.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/uk-business-tech-22-family-budget25' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only Apify account cap and current usage (GET only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from scripts.apify_budget_readonly_preflight import inspect
          token=os.getenv('APIFY_TOKEN','')
          result=inspect(token)
          limit=result['configured_account_limit_usd']
          used=result['current_monthly_usage_usd']
          remaining=result['remaining_to_account_limit_usd']
          headroom=round(remaining-8, 2)
          qualified=abs(limit-25)<0.00001 and headroom>=1.80
          print(json.dumps({
            'mode':'READ_ONLY_ACCOUNT_VERIFICATION',
            'account_limit_usd':limit,
            'account_usage_usd':used,
            'remaining_to_account_limit_usd':remaining,
            'protected_salesforce_reserve_usd':8,
            'ba_available_after_reserve_usd':headroom,
            'next_ba_run_ceiling_usd':1.80,
            'trial_preflight_passed':qualified,
            'actor_runs_started':0,
            'wordpress_requests':0
          },sort_keys=True))
          if not qualified:
            raise SystemExit('Account cap or protected headroom check not satisfied; no Actor launch')
          PY
      - name: Actor pricing preflight only (five metadata GETs)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scripts.ba_pricing_readonly
