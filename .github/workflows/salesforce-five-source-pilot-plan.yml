name: Salesforce five-source pilot plan (offline only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no-cost guardrails
        run: python -m unittest tests.test_plan_salesforce_five_source_pilot
      - name: Print approval-only plan; zero API calls
        run: python -m scripts.plan_salesforce_five_source_pilot
