name: Read CV-Library abort reason
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read run status only
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scripts.inspect_cv_library_abort_reason
      - uses: actions/upload-artifact@v4
        with:
          name: cv-library-abort-reason
          path: cv-library-abort-reason.json
          retention-days: 7
