name: Controlled Business Analysis five-source refresh (spend approval gated)
on:
  workflow_dispatch:
  schedule:
    # Tue/Fri 07:35 London local across DST; one UTC invocation is skipped.
    - cron: "35 6 * * 2,5"
    - cron: "35 7 * * 2,5"

permissions:
  contents: read

concurrency:
  group: shared-apify-acquisition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate independent BA source budget, scheduler and delivery gates
        run: |
          python -m scripts.ba_controlled_refresh
          python -m scripts.ba_recurring_cycle
          python -m scripts.validate_ba_five_source_contract
          python -m unittest discover -s tests -p test_ba_recurring_cycle.py -v
      - name: Check standing monetary authorisation in committed BA config
        id: approval
        run: |
          python -c 'import json; from pathlib import Path; c=json.loads(Path("business-analysis-tracker/config/automated_refresh_pipeline.json").read_text()); print("ready="+str(all(c.get(k) is True for k in ("enabled","paid_acquisition_enabled","scheduling_enabled","recurring_budget_approved","pricing_guard_verified","wordpress_delivery_enabled"))).lower())' >> "$GITHUB_OUTPUT"
      # No recurring spend unless the committed approval gate is enabled.
      # The optional repository variable 'false' provides an immediate pause.
      # TEMPORARY COST SAFETY HOLD: the 16 October manual run produced
      # 46 JobServe items despite maxResults=30. Do not spend on the next
      # Tue/Fri run until actor output sizing, QA and costs are reconciled.
      # The manual workflow also must NOT be retried.
      # Do not report a healthy acquisition when the spending step is disabled.
      # Keep this explicit failure until the JobServe 46/30 oversize receipt
      # and the Actor's actual charge behaviour have been reconciled.
      - name: Report blocked acquisition as unsuccessful (no paid API calls)
        run: |
          echo "BA_REFRESH_STATUS=BLOCKED_COST_SAFETY_HOLD"
          {
            echo "### BA acquisition: BLOCKED_COST_SAFETY_HOLD"
            echo "No paid Actors were launched and no WordPress snapshot was sent."
            echo "Reason: JobServe oversize output (46 items versus requested 30) requires verified cost and sizing reconciliation."
            echo "The scheduler and configuration preflight passing is not an acquisition success."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Collect five BA boards once and deliver only on quality-passed success
        if: ${{ false }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
          BA_PAID_REFRESH_APPROVAL: EXPLICIT_BA_REFRESH_APPROVED
          BA_WP_DELIVERY_APPROVAL: EXPLICIT_APPROVAL
          # The scheduled cron is authoritative; GitHub runners can start late.
          # The second DST cron is rejected by the Python season-specific gate.
          BA_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python -m scripts.ba_recurring_cycle --scheduled --execute --publish
      - name: Save QA and source-run receipts without raw contacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ba-recurring-refresh-audit
          path: |
            business-analysis-tracker/data/acquisition-receipts.json
          retention-days: 30
          if-no-files-found: warn
