name: One-time reviewed BA 124 WordPress delivery (no Apify)
on:
  push:
    branches:
      - audit/ba-paid-datasets-20261016-offline
    paths:
      - .github/workflows/ba-publish-reviewed-124-once-20261016.yml

permissions:
  contents: read

concurrency:
  group: ba-wordpress-receiver-single-delivery
  cancel-in-progress: false

jobs:
  publish-reviewed-124:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/audit/ba-paid-datasets-20261016-offline' && github.run_attempt == 1 && github.event.head_commit.message == '[BA-PUBLISH-REVIEWED-124-ONCE-20261016]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable reviewed source data and one-time delivery guards (no external calls)
        run: |
          python -m unittest discover -s tests -p 'test_ba_20261016_scope_124.py' -v
          python -m unittest discover -s tests -p 'test_ba_publish_124_delivery_guard.py' -v
      - name: Send exactly one quality-gated reviewed snapshot to v0.3.2 WordPress receiver
        env:
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
          BA_WP_DELIVERY_APPROVAL: EXPLICIT_APPROVAL
          BA_TRIGGER_MESSAGE: ${{ github.event.head_commit.message }}
        run: python -m scripts.ba_publish_reviewed_124_once
      # No Apify token; no Actor POST; no automatic retries or re-dispatch.
