name: One-time BA Oct 16 charge reconciliation (GET only)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/ba-20261016-billing-readonly.yml'
permissions:
  contents: read
jobs:
  charges:
    if: ${{ github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/ba-paid-datasets-20261016-offline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify account usage and exact five Actor-run charges without spending
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          runs=[
              ("CV-Library","OZpvK3rZ1PcXQhpWQ",0.65),
              ("Totaljobs","E89FZF0LvshuHJQa9",0.35),
              ("Reed UK","oLI4iND3OrwX1zu7p",0.20),
              ("Indeed UK","uR6l7FWPHSaOFlybv",0.35),
              ("JobServe","4GKDrAhj3X0zg4YdS",0.25)]
          ]
          token=os.environ["APIFY_TOKEN"]
          if not token:
              raise SystemExit("Missing Apify token; no calls")
          def api(endpoint):
              req=Request("https://api.apify.com/v2/"+endpoint,method="GET",
                  headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urlopen(req,timeout=25) as response:
                  obj=json.load(response)
              if not isinstance(obj,dict) or not isinstance(obj.get("data"),dict):
                  raise RuntimeError("Invalid Apify metadata response: "+endpoint)
              return obj["data"]
          limits=api("users/me/limits")
          monthly=api("users/me/usage/monthly?date=2026-10-16")
          allowed=(limits.get("limits") or {}).get("maxMonthlyUsageUsd")
          used=(limits.get("current") or {}).get("monthlyUsageUsd")
          if type(allowed) not in (float,int) or type(used) not in (float,int):
              raise RuntimeError("Account limits or usage unavailable")
          results=[]
          for source,run_id,cap in runs:
              info=api("actor-runs/"+run_id)
              if info.get("id")!=run_id or info.get("status")!="SUCCEEDED":
                  raise RuntimeError("Run not in successful terminal state: "+source)
              cost=info.get("usageTotalUsd")
              breakdown=info.get("usageUsd") or {}
              options=info.get("options") or {}
              events=info.get("chargedEventCounts") or {}
              results.append({"source":source,"run_id":run_id,
                  "status":info.get("status"),"finished_at":info.get("finishedAt"),
                  "usage_total_usd":round(cost,6) if type(cost) in (float,int) else None,
                  "requested_actor_charge_cap_usd":cap,
                  "run_option_charge_ceiling_usd":options.get("maxTotalChargeUsd"),
                  "compute_and_other_usage_usd":breakdown,
                  "charged_event_counts":events,
                  "charged_less_than_authorised_cap":(cost<=cap+0.0001)
                      if type(cost) in (float,int) else None})
          source_total=sum(r["usage_total_usd"] for r in results
                           if r["usage_total_usd"] is not None)
          output={"mode":"ACCOUNT_AUTHENTICATED_READ_ONLY","actor_runs_started":0,
              "wordpress_requests":0,"account_limit_usd":allowed,
              "account_usage_at_check_usd":round(used,6),
              "salesforce_reserve_usd":8,
              "available_after_salesforce_reserve_usd":round(allowed-used-8,6),
              "billing_cycle_start":(monthly.get("usageCycle") or {}).get("startAt"),
              "billing_cycle_end":(monthly.get("usageCycle") or {}).get("endAt"),
              "current_cycle_usage_usd":monthly.get("totalUsageCreditsUsdAfterVolumeDiscount"),
              "october_16_daily_usage_usd":next((
                  item.get("totalUsageCreditsUsd")
                  for item in monthly.get("dailyServiceUsages",[])
                  if str(item.get("date","")).startswith("2026-10-16")
              ),None),
              "runs":results,"run_totals_sum_usd":round(source_total,6),
              "all_run_charge_fields_present":all(r["usage_total_usd"] is not None for r in results),
              "all_runs_within_per_actor_cap":all(r["charged_less_than_authorised_cap"] is True for r in results),
              "total_within_1_80_refresh_cap":source_total<=1.8001}
          print("BILLING_RECONCILIATION "+json.dumps(output,sort_keys=True))
          if allowed!=25 or used>allowed or not output["all_run_charge_fields_present"]:
              raise SystemExit("Account or per-run charges not verifiable; remain paused")
          PY
