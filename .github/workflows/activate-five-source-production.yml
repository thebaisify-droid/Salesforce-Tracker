name: Activate five-source production refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activate-five-source-production.yml"

concurrency:
  group: salesforce-daily-refresh
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TRACKER_DATABASE_PATH: data/salesforce_tracker.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore current persistent master
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.restore_github_state --root . --artifact-name tracker-state --branch main

      - name: Preflight five-source configuration
        run: python -m pipeline.daily_refresh --config config/pipeline.json --check

      - name: Run five-source production refresh
        run: python -m pipeline.daily_refresh --config config/pipeline.json --force

      - name: Verify all five activation sources
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          latest=json.loads(Path("state/latest_success.json").read_text())
          sources={item["name"].split(":",1)[-1]:item for item in latest["sources"]}
          required=["source_1","source_2","source_3","source_4","source_5"]
          missing=[name for name in required if sources.get(name,{}).get("status")!="success"]
          if missing:
              raise SystemExit(f"five-source activation failed for: {missing}")
          if latest["summary"].get("quality_passed") is not True:
              raise SystemExit("quality gate did not pass")
          conn=sqlite3.connect("data/salesforce_tracker.db")
          total=conn.execute("SELECT COUNT(*) FROM vacancies WHERE is_active=1").fetchone()[0]
          dup=conn.execute("SELECT COUNT(*) FROM (SELECT job_url,COUNT(*) c FROM vacancies WHERE job_url IS NOT NULL AND job_url<>'' GROUP BY job_url HAVING c>1)").fetchone()[0]
          source_links=dict(conn.execute("SELECT source_name,COUNT(DISTINCT vacancy_id) FROM vacancy_sources GROUP BY source_name").fetchall())
          conn.close()
          result={
            "active_vacancies":total,
            "duplicate_job_urls":dup,
            "source_links":source_links,
            "run_id":latest["run_id"],
            "sources_succeeded":latest["summary"].get("sources_succeeded"),
            "sources_configured":latest["summary"].get("sources_configured"),
            "inserted_rows":latest["summary"].get("inserted_rows"),
            "updated_rows":latest["summary"].get("updated_rows"),
            "unchanged_rows":latest["summary"].get("unchanged_rows"),
            "raw_records_seen":latest["summary"].get("raw_records_seen"),
          }
          if dup:
              raise SystemExit(f"duplicate canonical URLs detected: {dup}")
          if not source_links.get("source_4") or not source_links.get("source_5"):
              raise SystemExit(f"enrichment source lineage missing: {source_links}")
          Path("state/five_source_activation.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Write verified persistent state manifest
        run: python -m scripts.state_snapshot --root . --database "$TRACKER_DATABASE_PATH" --write-manifest state/state_manifest.json

      - name: Upload five-source tracker state
        uses: actions/upload-artifact@v4
        with:
          name: tracker-state
          path: |
            data/salesforce_tracker.db
            state/
            dashboard/data.json
            dashboard/live-data.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish five-source dashboard JSON
        shell: bash
        run: |
          set -euo pipefail
          cp dashboard/live-data.json /tmp/live-data.json
          git config user.name "salesforce-tracker-bot"
          git config user.email "salesforce-tracker-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B dashboard-publish origin/main
          cp /tmp/live-data.json dashboard/live-data.json
          git add dashboard/live-data.json
          if git diff --cached --quiet; then
            echo "Dashboard JSON unchanged."
          else
            git commit -m "Update five-source live dashboard data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-source-activation-${{ github.run_id }}
          path: |
            state/*.json
            dashboard/*.json
          if-no-files-found: warn
          retention-days: 30
