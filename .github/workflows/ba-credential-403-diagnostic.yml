name: One-time BA credential 403 diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ba-credential-403-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnosis:
    if: ${{ contains(github.event.head_commit.message, '[BA-CREDENTIAL-DIAG-ONCE-20261015]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sanitized WordPress authentication result using GET
        env:
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
        run: python -m scripts.ba_credentials_403_diagnostic
