name: Salesforce billing preflight (read-only)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesforce-readonly-billing-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Apify $19 cap, current usage and protected $8 reserve
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m scripts.salesforce_controlled_refresh_budget
