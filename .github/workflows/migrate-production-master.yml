name: Migrate production Salesforce master

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-production-master.yml"

concurrency:
  group: salesforce-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TRACKER_DATABASE_PATH: data/salesforce_tracker.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore current production state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.restore_github_state --root . --artifact-name tracker-state --branch main

      - name: Migrate validated 45-vacancy baseline
        run: python -m scripts.migrate_baseline --database "$TRACKER_DATABASE_PATH" --report state/baseline_migration.json

      - name: Run fresh live refresh against migrated master
        run: python -m pipeline.daily_refresh --config config/pipeline.json --force

      - name: Verify migrated production master
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path

          conn=sqlite3.connect("data/salesforce_tracker.db")
          count=conn.execute("SELECT COUNT(*) FROM vacancies").fetchone()[0]
          active=conn.execute("SELECT COUNT(*) FROM vacancies WHERE is_active=1").fetchone()[0]
          dup=conn.execute("SELECT COUNT(*) FROM (SELECT job_url,COUNT(*) c FROM vacancies WHERE job_url IS NOT NULL AND job_url<>'' GROUP BY job_url HAVING c>1)").fetchone()[0]
          false_titles={row[0] for row in conn.execute("SELECT display_title FROM vacancies WHERE display_title IN ('Head of Sales','Field Sales Executive','Sales, Finance & Marketing Administrator','IT Program Manager','Senior Director Enterprise AI & Automation')")}
          michael=conn.execute("SELECT COUNT(*) FROM vacancies WHERE display_title='Salesforce Developer' AND (advertiser LIKE 'Michael Page%' OR location LIKE '%Yeovil%' OR location='BA201DL')").fetchone()[0]
          conn.close()

          latest=json.loads(Path("state/latest_success.json").read_text())
          result={
              "database_vacancies":count,
              "active_vacancies":active,
              "duplicate_job_urls":dup,
              "incidental_false_positive_titles":sorted(false_titles),
              "michael_page_salesforce_developer_rows":michael,
              "run_id":latest["run_id"],
              "sources_succeeded":latest["summary"].get("sources_succeeded"),
              "quality_passed":latest["summary"].get("quality_passed"),
              "inserted_rows":latest["summary"].get("inserted_rows"),
              "updated_rows":latest["summary"].get("updated_rows"),
              "unchanged_rows":latest["summary"].get("unchanged_rows"),
          }

          if count < 52 or active < 52:
              raise SystemExit(f"production master is unexpectedly small: {count} total / {active} active")
          if dup:
              raise SystemExit(f"canonical URL duplicates detected: {dup}")
          if false_titles:
              raise SystemExit(f"incidental Salesforce roles entered master: {sorted(false_titles)}")
          if michael != 1:
              raise SystemExit(f"expected one Michael Page Salesforce Developer, got {michael}")
          if result["sources_succeeded"] != 3 or result["quality_passed"] is not True:
              raise SystemExit("production refresh did not pass the 3-source quality gate")

          Path("state/production_migration_proof.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Write verified persistent state manifest
        run: python -m scripts.state_snapshot --root . --database "$TRACKER_DATABASE_PATH" --write-manifest state/state_manifest.json

      - name: Upload new production tracker state
        uses: actions/upload-artifact@v4
        with:
          name: tracker-state
          path: |
            data/salesforce_tracker.db
            state/
            dashboard/data.json
            dashboard/live-data.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish migrated dashboard JSON to main
        shell: bash
        run: |
          set -euo pipefail
          cp dashboard/live-data.json /tmp/live-data.json
          git config user.name "salesforce-tracker-bot"
          git config user.email "salesforce-tracker-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B dashboard-publish origin/main
          cp /tmp/live-data.json dashboard/live-data.json
          git add dashboard/live-data.json
          if git diff --cached --quiet; then
            echo "Public dashboard JSON is unchanged."
          else
            git commit -m "Update migrated live dashboard data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-master-migration-${{ github.run_id }}
          path: |
            state/*.json
            dashboard/*.json
          if-no-files-found: warn
          retention-days: 30
