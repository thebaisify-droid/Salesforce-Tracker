name: One-time BA delivery credential read-only verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ba-credential-readonly-once.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ contains(github.event.head_commit.message, '[BA-CREDENTIAL-CHECK-ONCE-20261015]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify BA WordPress identity and receiver, no writes
        env:
          BA_WP_USERNAME: ${{ secrets.BA_WP_USERNAME }}
          BA_WP_APPLICATION_PASSWORD: ${{ secrets.BA_WP_APPLICATION_PASSWORD }}
        run: python -m scripts.ba_delivery_credentials_readonly
